document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"ko\"><head>\n<meta charset=\"utf-8\">\n<style>/* ===========================================================================\n   TriAgain Design System — global entry point\n   Consumers link THIS file. It only @imports the token + font layers.\n   Keep this file imports-only; never add rules here.\n   =========================================================================== */\n\n/* ===========================================================================\n   TriAgain — Fonts\n   Pretendard: a clean, neutral Korean+Latin sans. Hierarchy comes from\n   weight + size, never from color tricks. Loaded from CDN (variable woff2).\n   NOTE: shipping via jsDelivr CDN. To fully self-host, drop the woff2 files\n   in assets/fonts/ and repoint src below.\n   =========================================================================== */\n\n@font-face {\n  font-family: \"Pretendard Variable\";\n  font-weight: 45 920;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2\") format(\"woff2-variations\");\n}\n\n/* Mono — for invite codes. JetBrains Mono is a close, even-width match. */\n@font-face {\n  font-family: \"TA Mono\";\n  font-weight: 400 700;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"098b8a06-0574-47bc-ba29-5c0876e8896c\") format(\"woff2\");\n}\n\n/* ===========================================================================\n   TriAgain — Color Tokens\n   Dark, warm, motivating. Near-black canvas + a single confident orange.\n   Status colors are the only other hues, used sparingly as signal.\n   =========================================================================== */\n\n:root {\n  /* ---- Brand / Point -------------------------------------------------- */\n  --ta-orange: #FE512A;          /* primary point — CTA, active, accents (logo ink) */\n  --ta-orange-pressed: #E5421C;  /* pressed / active-down state              */\n  --ta-orange-hover: #FF6A3D;    /* hover lift (web)                         */\n  --ta-orange-ink: #FE512A;      /* logo / brand mark ink                    */\n\n  /* Translucent orange — glow, tints, focus rings */\n  --ta-orange-12: rgba(254, 81, 42, 0.12);\n  --ta-orange-20: rgba(254, 81, 42, 0.20);\n  --ta-orange-32: rgba(254, 81, 42, 0.32);\n  --ta-orange-glow: rgba(254, 81, 42, 0.45);\n\n  /* ---- Canvas & Surfaces --------------------------------------------- */\n  --ta-bg: #0A0A0B;              /* app background — near black              */\n  --ta-bg-elevated: #161618;     /* sheets / modals raised off the canvas    */\n  --ta-surface: #242428;         /* cards, list rows                         */\n  --ta-surface-2: #2E3034;       /* nested surface, inputs, tracks           */\n  --ta-surface-3: #3A3C42;       /* hover on surface, dividers-as-fill       */\n\n  /* ---- Hairlines & Borders ------------------------------------------- */\n  --ta-border: rgba(255, 255, 255, 0.08);   /* default card hairline        */\n  --ta-border-strong: rgba(255, 255, 255, 0.16);\n  --ta-border-faint: rgba(255, 255, 255, 0.05);\n\n  /* ---- Text ----------------------------------------------------------- */\n  --ta-text: #FFFFFF;            /* primary — titles, key numbers            */\n  --ta-text-secondary: #A1A1A3;  /* body, descriptions, supporting copy      */\n  --ta-text-caption: #6C737E;    /* captions, dates, meta, placeholders      */\n  --ta-text-disabled: #51545B;   /* disabled labels                          */\n  --ta-text-on-orange: #FFFFFF;  /* text on orange fills                     */\n  --ta-text-on-kakao: #191600;   /* text on Kakao yellow                     */\n\n  /* ---- Status (challenge / crew states) ------------------------------ */\n  --ta-progress: #00B991;        /* 진행중  In progress                       */\n  --ta-recruiting: #F9D869;      /* 모집중  Recruiting                        */\n  --ta-done: #8A8F98;            /* 완료    Completed / closed                */\n\n  /* Status tint backgrounds (pills) */\n  --ta-progress-bg: rgba(0, 185, 145, 0.16);\n  --ta-recruiting-bg: rgba(249, 216, 105, 0.16);\n  --ta-done-bg: rgba(138, 143, 152, 0.16);\n\n  /* ---- Brand partners ------------------------------------------------- */\n  --ta-kakao: #FEE500;           /* Kakao login                              */\n  --ta-apple: #FFFFFF;           /* Apple / Sign in with Apple               */\n\n  /* =====================================================================\n     SEMANTIC ALIASES — prefer these in components\n     ===================================================================== */\n  --color-bg: var(--ta-bg);\n  --color-surface: var(--ta-surface);\n  --color-surface-nested: var(--ta-surface-2);\n  --color-surface-sheet: var(--ta-bg-elevated);\n\n  --color-accent: var(--ta-orange);\n  --color-accent-pressed: var(--ta-orange-pressed);\n  --color-accent-tint: var(--ta-orange-12);\n  --color-glow: var(--ta-orange-glow);\n\n  --color-text: var(--ta-text);\n  --color-text-muted: var(--ta-text-secondary);\n  --color-text-caption: var(--ta-text-caption);\n\n  --color-border: var(--ta-border);\n  --color-divider: var(--ta-border-faint);\n\n  --status-active: var(--ta-progress);\n  --status-open: var(--ta-recruiting);\n  --status-closed: var(--ta-done);\n}\n\n/* ===========================================================================\n   TriAgain — Typography Tokens\n   Pretendard. Scale runs Display 34 → Micro 12. Hierarchy is built from\n   SIZE and WEIGHT only. Letter-spacing tightens slightly on large display.\n   =========================================================================== */\n\n:root {\n  /* ---- Families ------------------------------------------------------- */\n  --font-sans: \"Pretendard Variable\", \"Pretendard\", -apple-system,\n               BlinkMacSystemFont, \"Apple SD Gothic Neo\", system-ui, sans-serif;\n  --font-mono: \"TA Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* ---- Weights -------------------------------------------------------- */\n  --fw-regular: 400;     /* @kind font */\n  --fw-medium: 500;      /* @kind font */\n  --fw-semibold: 600;    /* @kind font */\n  --fw-bold: 700;        /* @kind font */\n  --fw-extrabold: 800;   /* @kind font */\n\n  /* ---- Size scale (px) ------------------------------------------------ */\n  --fs-display: 34px;   /* splash / hero wordmark, big celebratory headers   */\n  --fs-title-1: 28px;   /* screen title (large)                              */\n  --fs-title-2: 24px;   /* screen title / nav header                         */\n  --fs-heading: 20px;   /* card title, section heading                       */\n  --fs-body-lg: 18px;   /* prominent body, list primary                      */\n  --fs-body: 16px;      /* default body                                      */\n  --fs-callout: 15px;   /* supporting copy, secondary list line              */\n  --fs-footnote: 14px;  /* meta rows, dates, chips                           */\n  --fs-caption: 13px;   /* captions, helper text                             */\n  --fs-micro: 12px;     /* smallest — timestamps, counters                   */\n\n  /* ---- Line heights --------------------------------------------------- */\n  --lh-tight: 1.15;     /* @kind font */ /* display & titles */\n  --lh-snug: 1.3;       /* @kind font */ /* headings */\n  --lh-normal: 1.5;     /* @kind font */ /* body & reading copy */\n\n  /* ---- Tracking ------------------------------------------------------- */\n  --ls-display: -0.02em; /* @kind font */\n  --ls-title: -0.01em;   /* @kind font */\n  --ls-normal: 0;        /* @kind font */\n  --ls-code: 0.18em;     /* invite codes — wide, deliberate @kind font       */\n\n  /* =====================================================================\n     ROLE ALIASES\n     ===================================================================== */\n  --text-display: var(--fw-bold) var(--fs-display) / var(--lh-tight) var(--font-sans);\n  --text-title-1: var(--fw-bold) var(--fs-title-1) / var(--lh-tight) var(--font-sans);\n  --text-title-2: var(--fw-bold) var(--fs-title-2) / var(--lh-tight) var(--font-sans);\n  --text-heading: var(--fw-bold) var(--fs-heading) / var(--lh-snug) var(--font-sans);\n  --text-body: var(--fw-regular) var(--fs-body) / var(--lh-normal) var(--font-sans);\n  --text-body-strong: var(--fw-semibold) var(--fs-body) / var(--lh-normal) var(--font-sans);\n  --text-callout: var(--fw-regular) var(--fs-callout) / var(--lh-normal) var(--font-sans);\n  --text-footnote: var(--fw-medium) var(--fs-footnote) / var(--lh-normal) var(--font-sans);\n  --text-caption: var(--fw-regular) var(--fs-caption) / var(--lh-normal) var(--font-sans);\n}\n\n/* ===========================================================================\n   TriAgain — Spacing, Radius & Sizing Tokens\n   8pt-based rhythm. Generous gutters on a phone canvas (20px screen padding).\n   Corners are soft and rounded — never sharp, never pill unless it's a chip.\n   =========================================================================== */\n\n:root {\n  /* ---- Spacing scale (4 / 8 based) ----------------------------------- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;   /* default screen side padding                        */\n  --space-6: 24px;\n  --space-7: 32px;\n  --space-8: 40px;\n  --space-9: 48px;\n  --space-10: 64px;\n\n  /* ---- Semantic spacing ---------------------------------------------- */\n  --screen-pad: 20px;        /* left/right gutter on phone screens          */\n  --card-pad: 20px;          /* inner padding of cards                      */\n  --stack-gap: 16px;         /* gap between stacked cards                   */\n  --row-gap: 12px;           /* gap inside a row of meta                    */\n\n  /* ---- Radius --------------------------------------------------------- */\n  --radius-sm: 8px;          /* chips, small controls                       */\n  --radius-md: 12px;         /* inputs, secondary buttons                   */\n  --radius-lg: 16px;         /* cards, primary buttons                      */\n  --radius-xl: 20px;         /* large cards, sheets, code box               */\n  --radius-2xl: 28px;        /* hero containers                             */\n  --radius-pill: 999px;      /* status pills, category chips, avatars       */\n\n  /* ---- Control heights ----------------------------------------------- */\n  --control-sm: 36px;\n  --control-md: 44px;        /* min iOS hit target                          */\n  --control-lg: 56px;        /* primary CTA                                 */\n\n  /* ---- Hit target ----------------------------------------------------- */\n  --hit-min: 44px;\n}\n\n/* ===========================================================================\n   TriAgain — Effects: shadow, glow, blur, motion\n   The signature is the ORANGE GLOW — used on the primary CTA and the invite\n   code box. Elevation is otherwise quiet (this is a dark UI; depth comes from\n   surface lightness, not heavy drop shadows).\n   =========================================================================== */\n\n:root {\n  /* ---- Elevation (subtle on dark) ------------------------------------ */\n  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4);\n  --shadow-raised: 0 8px 24px rgba(0, 0, 0, 0.5);\n  --shadow-sheet: 0 -8px 40px rgba(0, 0, 0, 0.6);\n\n  /* ---- Orange glow — the brand's signature light --------------------- */\n  --glow-cta: 0 6px 24px rgba(254, 81, 42, 0.38);\n  --glow-cta-strong: 0 8px 32px rgba(254, 81, 42, 0.50);\n  --glow-code: 0 0 0 1px rgba(254, 81, 42, 0.55),\n               0 0 24px rgba(254, 81, 42, 0.30);\n  --glow-ring: 0 0 0 3px rgba(254, 81, 42, 0.32);   /* focus ring          */\n\n  /* ---- Blur (sheets, sticky bars over content) ----------------------- */\n  --blur-bar: blur(20px);  /* @kind other */\n\n  /* ---- Motion --------------------------------------------------------- */\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);   /* @kind other */ /* calm settle */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);  /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);  /* @kind other */ /* celebratory pop */\n\n  --dur-fast: 120ms;     /* @kind other */ /* press feedback */\n  --dur-base: 220ms;     /* @kind other */ /* taps, toggles, hovers */\n  --dur-slow: 380ms;     /* @kind other */ /* sheet / screen transitions */\n\n  /* Press feedback — scale used across tappable elements */\n  --press-scale: 0.97;   /* @kind other */\n}\n\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; }\n  .og {\n    width: 1200px; height: 630px; background: var(--ta-bg); position: relative; overflow: hidden;\n    font-family: var(--font-sans); display: flex; align-items: center;\n  }\n  /* faint warm bloom, off to one side — never a loud gradient */\n  .og::before {\n    content: \"\"; position: absolute; width: 760px; height: 760px; right: -180px; top: 50%;\n    transform: translateY(-50%);\n    background: radial-gradient(circle, rgba(254,81,42,0.16) 0%, rgba(254,81,42,0.05) 38%, transparent 64%);\n    pointer-events: none;\n  }\n  /* hairline frame for polish */\n  .og::after {\n    content: \"\"; position: absolute; inset: 28px; border: 1px solid var(--ta-border-faint);\n    border-radius: 28px; pointer-events: none;\n  }\n  .inner { position: relative; z-index: 2; display: flex; align-items: center; gap: 64px; padding: 0 100px; }\n  .mark { width: 188px; height: 188px; flex-shrink: 0; filter: drop-shadow(0 8px 40px rgba(254,81,42,0.35)); }\n  .stack { display: flex; flex-direction: column; gap: 18px; }\n  .wordmark { font-weight: 800; font-size: 104px; line-height: 1; letter-spacing: -0.03em; color: var(--ta-text); }\n  .slogan { font-weight: 700; font-size: 40px; color: var(--ta-orange); letter-spacing: -0.01em; }\n  .en { font-weight: 500; font-size: 26px; color: var(--ta-text-caption); letter-spacing: 0.01em; }\n  .divider { width: 56px; height: 4px; border-radius: 2px; background: var(--ta-surface-3); margin: 6px 0; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  <div class=\"og\">\n    <div class=\"inner\">\n      <img class=\"mark\" src=\"e1fd16fe-1bbb-4f69-85cc-7316855ab9f5\" alt=\"TriAgain\">\n      <div class=\"stack\">\n        <div class=\"wordmark\">TriAgain<\u002Fdiv>\n        <div class=\"slogan\">작심삼일도 괜찮아<\u002Fdiv>\n        <div class=\"divider\"><\u002Fdiv>\n        <div class=\"en\">Start Small. Try Again.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  \n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
