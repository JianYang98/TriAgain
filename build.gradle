plugins {
    id 'java'
    id 'checkstyle'
    id 'org.springframework.boot' version '3.4.13'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.triagain'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

checkstyle {
    toolVersion = '10.21.1'
    configFile = file('config/checkstyle/triagain-checkstyle-rules.xml')
    configProperties = [
        'suppressionFile': file('config/checkstyle/triagain-checkstyle-suppressions.xml').absolutePath
    ]
    ignoreFailures = false
    maxWarnings = 0
}

// 테스트 소스는 전용 서프레션을 쓴다 — 한글 테스트·스텝명 면제(MethodName·Abbreviation)가
// main 으로 새면 안 되기 때문이다. 이 분기는 .claude/hooks/checkstyle-hook.sh 와 짝이다.
// ⚠️ configProperties 를 재대입하면 위 checkstyle 확장(L25-27)의 값이 통째로 덮인다.
//    지금은 프로퍼티가 suppressionFile 하나뿐이라 문제없지만, 늘어나면 여기도 같이 고쳐야 한다.
tasks.named('checkstyleTest') {
    configProperties = [
        'suppressionFile': file('config/checkstyle/triagain-checkstyle-suppressions-test.xml').absolutePath
    ]
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // MyBatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'

    // AWS S3
    implementation platform('software.amazon.awssdk:bom:2.31.3')
    implementation 'software.amazon.awssdk:s3'

    // Firebase Admin SDK (FCM)
    implementation 'com.google.firebase:firebase-admin:9.4.3'

    // Spring Retry
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // Database
    runtimeOnly 'org.postgresql:postgresql'

    // Flyway
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    // Cucumber
    testImplementation 'io.cucumber:cucumber-java:7.17.0'
    testImplementation 'io.cucumber:cucumber-spring:7.17.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.17.0'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.2'

    // REST-Assured
    testImplementation 'io.rest-assured:rest-assured:5.5.0'

    // Testcontainers
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'e2e'
    }
}

tasks.register('e2eTest', Test) {
    // 뭐가 실리는지 열거하지 않는다 — 새 카테고리가 e2e 태그를 받을 때마다 낡는다.
    // 실제 목록은 돌려서 확인하고(build/test-results/e2eTest/), 정본은 rules/test-strategy.md 다.
    description = '@Tag("e2e") 가 붙은 테스트 실행'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'e2e'
        includeEngines 'junit-jupiter'
    }

    // 0건 실행 방지. 태그가 하나도 안 맞으면 이 태스크는 아무것도 안 돌고 그냥 그린이 된다
    // (실측: BUILD SUCCESSFUL, 결과 XML 없음). 그러면 CI의 required check "E2E Tests"가
    // 헛돈 채 통과하고, 빨간불이 안 뜨므로 알아챌 계기 자체가 없다.
    // 태그는 E2eTestBase 상속으로도 전파되므로 상속이 끊겨도 여기서 걸린다.
    // Gradle 8.12에는 failOnNoDiscoveredTests가 없어(8.13+) 직접 센다.
    //
    // SKIPPED 를 빼는 이유: afterTest 는 @Disabled 로 건너뛴 테스트에도 불린다
    // (실측 — 전부 @Disabled 인 클래스만 선택했더니 tests="1" skipped="1" 로 가드가 통과했다).
    // 즉 "발견은 됐지만 본문은 한 줄도 안 돈" 두 번째 0건 시나리오가 있다.
    def executed = new java.util.concurrent.atomic.AtomicInteger()
    afterTest { desc, result ->
        if (result.resultType != org.gradle.api.tasks.testing.TestResult.ResultType.SKIPPED) {
            executed.incrementAndGet()
        }
    }
    doLast {
        if (executed.get() == 0) {
            throw new GradleException(
                'e2eTest가 실제로 실행한 테스트가 0개다 — @Tag("e2e")·E2eTestBase 상속이 사라졌거나 '
                    + '전부 @Disabled 인지 확인하라')
        }
    }
}
