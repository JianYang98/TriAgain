name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
    # 이 목록의 파일만 바꾼 PR은 ci·e2e를 건너뛴다. scripts/는 E2E 테스트 입력이라 넣지 않는다.
    paths-ignore:
      - '*.md'          # 루트의 AGENTS.md, CLAUDE.md
      - 'docs/**'
      - 'load-test/**'
      - '.claude/**'
      - '.agents/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  ci:
    if: github.event_name == 'pull_request'
    name: CI (Unit + Cucumber)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: build/test-results/test/*.xml
          reporter: java-junit

      - name: Upload Cucumber report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report
          path: build/reports/cucumber/
          retention-days: 14

  e2e:
    if: github.event_name == 'pull_request'
    name: E2E Tests
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run E2E tests
        run: ./gradlew e2eTest

      - name: Publish E2E test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E Test Results
          path: build/test-results/e2eTest/*.xml
          reporter: java-junit

  deploy-backend:
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    concurrency:
      group: triagain-production-backend
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Select image tag for deployment branch
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/main)
              echo "IMAGE_TAG=latest" >> "$GITHUB_ENV"
              ;;
            refs/heads/develop)
              echo "IMAGE_TAG=develop" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported deployment ref: $GITHUB_REF" >&2
              exit 1
              ;;
          esac

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            devjian/triagain:${{ env.IMAGE_TAG }}
            devjian/triagain:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_REFRESH_KEY: ${{ secrets.APPLE_REFRESH_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET,INTERNAL_API_KEY,APPLE_TEAM_ID,APPLE_KEY_ID,APPLE_PRIVATE_KEY,APPLE_REFRESH_KEY,IMAGE_TAG
          script: |
            set -euo pipefail

            # 호스트에 공개하는 서비스 포트. -p의 컨테이너 쪽 8080은 앱 기본값이라 고정이다.
            SERVICE_PORT=8080

            # Firebase 키 파일 존재 체크
            FIREBASE_KEY_PATH="/home/ec2-user/triagain/config/triagain-firebase-service-account.json"
            if [ -f "$FIREBASE_KEY_PATH" ]; then
              echo "[INFO] Firebase key found. FCM enabled."
              FIREBASE_ENABLED=true
            else
              echo "[WARN] Firebase key not found at $FIREBASE_KEY_PATH. FCM disabled."
              FIREBASE_ENABLED=false
            fi

            IMAGE="devjian/triagain:${IMAGE_TAG}"
            docker pull "$IMAGE"

            # 실제 HostPort가 SERVICE_PORT인 컨테이너만 검사한다. 다른 컨테이너는 건드리지 않는다.
            PUBLISHED_CONTAINER_IDS="$(docker ps --filter publish="${SERVICE_PORT}" --quiet)"
            for CONTAINER_ID in $PUBLISHED_CONTAINER_IDS; do
              CONTAINER_NAME="$(docker inspect --format '{{.Name}}' "$CONTAINER_ID")"
              HOST_PORTS="$(docker inspect --format '{{range $p, $bindings := .NetworkSettings.Ports}}{{range $bindings}}{{printf "%s\n" .HostPort}}{{end}}{{end}}' "$CONTAINER_ID")"
              if [ "$CONTAINER_NAME" != "/triagain" ] && grep -Fqx "$SERVICE_PORT" <<< "$HOST_PORTS"; then
                echo "[ERROR] Host port ${SERVICE_PORT} is owned by unexpected container ${CONTAINER_NAME} (${CONTAINER_ID}); leaving it untouched." >&2
                exit 1
              fi
            done

            # 이름이 정확히 triagain인 컨테이너만 교체한다.
            if OLD_CONTAINER_ID="$(docker inspect --type=container --format '{{.Id}}' triagain 2>/dev/null)"; then
              OLD_CONTAINER_RUNNING="$(docker inspect --format '{{.State.Running}}' "$OLD_CONTAINER_ID")"
              if [ "$OLD_CONTAINER_RUNNING" = true ]; then
                docker stop "$OLD_CONTAINER_ID"
              fi
              docker rm "$OLD_CONTAINER_ID"
            fi

            NEW_CONTAINER_ID="$(docker run -d --name triagain --restart unless-stopped \
              -p "${SERVICE_PORT}:8080" \
              --cpus 1.4 \
              --memory 700m \
              --memory-swap 700m \
              --log-driver=awslogs \
              --log-opt awslogs-region=ap-northeast-2 \
              --log-opt awslogs-group=/triagain/app \
              --log-opt awslogs-stream=triagain \
              --log-opt awslogs-create-group=true \
              -v /home/ec2-user/triagain/config:/opt/triagain/config:ro \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e "DB_URL=$DB_URL" \
              -e "DB_USERNAME=$DB_USERNAME" \
              -e "DB_PASSWORD=$DB_PASSWORD" \
              -e "JWT_SECRET=$JWT_SECRET" \
              -e "INTERNAL_API_KEY=$INTERNAL_API_KEY" \
              -e "APPLE_TEAM_ID=$APPLE_TEAM_ID" \
              -e "APPLE_KEY_ID=$APPLE_KEY_ID" \
              -e "APPLE_PRIVATE_KEY=$APPLE_PRIVATE_KEY" \
              -e "APPLE_REFRESH_KEY=$APPLE_REFRESH_KEY" \
              -e "FIREBASE_ENABLED=$FIREBASE_ENABLED" \
              -e "FIREBASE_SERVICE_ACCOUNT_PATH=/opt/triagain/config/triagain-firebase-service-account.json" \
              "$IMAGE")"

            NEW_CONTAINER_RUNNING="$(docker inspect --format '{{.State.Running}}' "$NEW_CONTAINER_ID")"
            NEW_CONTAINER_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$NEW_CONTAINER_ID")"
            if [ "$NEW_CONTAINER_RUNNING" != true ] || [ "$NEW_CONTAINER_IMAGE" != "$IMAGE" ]; then
              echo "[ERROR] New triagain container ${NEW_CONTAINER_ID} is not running the expected image." >&2
              docker inspect --format 'state={{.State.Status}} image={{.Config.Image}}' "$NEW_CONTAINER_ID" >&2
              exit 1
            fi

            HEALTHY=false
            for ATTEMPT in {1..30}; do
              if curl --fail --silent --show-error --max-time 3 --output /dev/null "http://localhost:${SERVICE_PORT}/actuator/health"; then
                HEALTHY=true
                echo "[INFO] New triagain container ${NEW_CONTAINER_ID} passed health check on attempt ${ATTEMPT}."
                break
              fi
              echo "[INFO] Waiting for new triagain container health (${ATTEMPT}/30)."
              sleep 2
            done
            if [ "$HEALTHY" != true ]; then
              echo "[ERROR] New triagain container ${NEW_CONTAINER_ID} did not become healthy." >&2
              docker inspect --format 'state={{.State.Status}} image={{.Config.Image}}' "$NEW_CONTAINER_ID" >&2
              exit 1
            fi

            FINAL_CONTAINER_RUNNING="$(docker inspect --format '{{.State.Running}}' "$NEW_CONTAINER_ID")"
            FINAL_CONTAINER_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$NEW_CONTAINER_ID")"
            if [ "$FINAL_CONTAINER_RUNNING" != true ] || [ "$FINAL_CONTAINER_IMAGE" != "$IMAGE" ]; then
              echo "[ERROR] New triagain container ${NEW_CONTAINER_ID} stopped or changed image after health check." >&2
              docker inspect --format 'state={{.State.Status}} image={{.Config.Image}}' "$NEW_CONTAINER_ID" >&2
              exit 1
            fi

            if docker image prune -f; then
              echo "[INFO] Dangling image cleanup completed."
            else
              echo "[WARN] Dangling image cleanup failed after successful deployment." >&2
            fi

  check-lambda-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      lambda_changed: ${{ steps.filter.outputs.lambda }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            lambda:
              - 'lambda/**'

  deploy-lambda:
    needs: [check-lambda-changes]
    if: github.event_name == 'push' && needs.check-lambda-changes.outputs.lambda_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM build
        run: sam build --template-file lambda/template.yaml

      - name: SAM deploy
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name triagain-lambda \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              BackendUrl=${{ secrets.BACKEND_URL }} \
              InternalApiKey=${{ secrets.INTERNAL_API_KEY }}
