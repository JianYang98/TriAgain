name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write

jobs:
  ci:
    if: github.event_name == 'pull_request'
    name: CI (Unit + Cucumber)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: build/test-results/test/*.xml
          reporter: java-junit

      - name: Upload Cucumber report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report
          path: build/reports/cucumber/
          retention-days: 14

  e2e:
    if: github.event_name == 'pull_request'
    name: E2E Tests
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run E2E tests
        run: ./gradlew e2eTest

      - name: Publish E2E test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E Test Results
          path: build/test-results/e2eTest/*.xml
          reporter: java-junit

  deploy-backend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            devjian/triagain:latest
            devjian/triagain:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_REFRESH_KEY: ${{ secrets.APPLE_REFRESH_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET,INTERNAL_API_KEY,APPLE_TEAM_ID,APPLE_KEY_ID,APPLE_PRIVATE_KEY,APPLE_REFRESH_KEY
          script: |
            # Firebase 키 파일 존재 체크
            FIREBASE_KEY_PATH="/home/ec2-user/triagain/config/triagain-firebase-service-account.json"
            if [ -f "$FIREBASE_KEY_PATH" ]; then
              echo "[INFO] Firebase key found. FCM enabled."
              FIREBASE_ENABLED=true
            else
              echo "[WARN] Firebase key not found at $FIREBASE_KEY_PATH. FCM disabled."
              FIREBASE_ENABLED=false
            fi

            docker pull devjian/triagain:latest
            docker stop triagain || true && docker rm triagain || true
            docker run -d --name triagain --restart unless-stopped \
              -p 8080:8080 \
              --log-driver=awslogs \
              --log-opt awslogs-region=ap-northeast-2 \
              --log-opt awslogs-group=/triagain/app \
              --log-opt awslogs-stream-prefix=triagain \
              --log-opt awslogs-create-group=true \
              -v /home/ec2-user/triagain/config:/opt/triagain/config:ro \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e "DB_URL=$DB_URL" \
              -e "DB_USERNAME=$DB_USERNAME" \
              -e "DB_PASSWORD=$DB_PASSWORD" \
              -e "JWT_SECRET=$JWT_SECRET" \
              -e "INTERNAL_API_KEY=$INTERNAL_API_KEY" \
              -e "APPLE_TEAM_ID=$APPLE_TEAM_ID" \
              -e "APPLE_KEY_ID=$APPLE_KEY_ID" \
              -e "APPLE_PRIVATE_KEY=$APPLE_PRIVATE_KEY" \
              -e "APPLE_REFRESH_KEY=$APPLE_REFRESH_KEY" \
              -e "FIREBASE_ENABLED=$FIREBASE_ENABLED" \
              -e "FIREBASE_SERVICE_ACCOUNT_PATH=/opt/triagain/config/triagain-firebase-service-account.json" \
              devjian/triagain:latest
            sleep 15
            curl -f http://localhost:8080/actuator/health
            docker image prune -f

  check-lambda-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      lambda_changed: ${{ steps.filter.outputs.lambda }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            lambda:
              - 'lambda/**'

  deploy-lambda:
    needs: [check-lambda-changes]
    if: github.event_name == 'push' && needs.check-lambda-changes.outputs.lambda_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM build
        run: sam build --template-file lambda/template.yaml

      - name: SAM deploy
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name triagain-lambda \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              BackendUrl=${{ secrets.BACKEND_URL }} \
              InternalApiKey=${{ secrets.INTERNAL_API_KEY }}
