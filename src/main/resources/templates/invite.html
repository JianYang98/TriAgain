<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>TriAgain 초대</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --arrow-rotate: -5deg;   /* ← 화살표 각도. 양수=시계방향, 음수=반시계방향 */
      --bg: #0A0A0B;
      --card: #1c1c1f;
      --main: #FE5027;
      --main-glow: rgba(254, 80, 39, 0.2);
      --white: #FFFFFF;
      --grey3: #808996;
      --grey1: #2E3034;
      --success: #00B991;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::after {
      content: '';
      position: fixed;
      top: -160px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(254,80,39,0.07) 0%, transparent 68%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 28px 40px;
      max-width: 420px;
      margin: 0 auto;
      gap: 0;
    }

    /* ── Header block (logo + slogan) ── */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeUp .55s ease .05s forwards;
    }
    .logo-wrap img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      border-radius: 20px;
    }
    .slogan {
      font-size: 20px;
      font-weight: 900;
      color: var(--white);
      letter-spacing: -0.01em;
    }

    /* ── Hint ── */
    .hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      width: 100%;
      opacity: 0;
      animation: fadeUp .55s ease .28s forwards;
    }
    .hint-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--grey3);
    }
    .hint-arrow-svg {
      color: #FF4810;
      transform: rotate(var(--arrow-rotate, 0deg));
      transform-origin: center center;
    }

    /* ── Code Box ── */
    .code-box {
      width: auto;
      min-width: 220px;
      max-width: 100%;
      display: flex;
      align-items: center;
      background: var(--card);
      border: 1px solid rgba(254,80,39,.3);
      box-shadow: 0 0 18px rgba(254,80,39,.15), inset 0 0 0 1px rgba(254,80,39,.08);
      border-radius: 20px;
      padding: 22px 18px 22px 26px;
      gap: 10px;
      cursor: pointer;
      transition: box-shadow .2s, background .18s;
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      animation: fadeUp .55s ease .38s forwards;
    }
    .code-box:hover {
      box-shadow: 0 0 28px rgba(254,80,39,.25), inset 0 0 0 1px rgba(254,80,39,.15);
    }
    .code-box:active {
      background: #232326;
    }
    .code-box.copied {
      border-color: rgba(0,185,145,.4);
      box-shadow: 0 0 20px rgba(0,185,145,.2);
      animation: fadeUp .55s ease .38s forwards, pulse .4s ease;
    }

    .code-text {
      flex: 1;
      min-width: 0;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .copy-btn {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(254,80,39,.18);
      border: 1px solid rgba(254,80,39,.3);
      border-radius: 10px;
      cursor: pointer;
      color: #FF7A5A;
      transition: background .15s, color .15s, border-color .15s;
      position: relative;
    }
    .copy-btn:hover {
      background: rgba(254,80,39,.28);
      color: var(--white);
      border-color: rgba(254,80,39,.5);
    }
    .copy-btn.copied {
      background: rgba(0,185,145,.18);
      border-color: rgba(0,185,145,.3);
      color: var(--success);
    }

    .copy-icon, .check-icon {
      width: 18px;
      height: 18px;
      transition: opacity .18s, transform .18s;
      position: absolute;
    }
    .check-icon { opacity: 0; transform: scale(.6); }
    .copy-btn.copied .copy-icon { opacity: 0; transform: scale(.6); }
    .copy-btn.copied .check-icon { opacity: 1; transform: scale(1); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #1e1e22;
      border: 1px solid #2e2e34;
      color: var(--success);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 100px;
      opacity: 0;
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin: 28px 0 22px;
      opacity: 0;
      animation: fadeUp .55s ease .5s forwards;
    }
    .divider-line { flex: 1; height: 1px; background: var(--grey1); }
    .divider-text { font-size: 12px; color: var(--grey3); white-space: nowrap; }

    /* ── Store Button ── */
    .store-wrap {
      width: 100%;
      opacity: 0;
      animation: fadeUp .55s ease .6s forwards;
    }
    .store-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 20px;
      background: #111113;
      border: 1px solid #2E3034;
      border-radius: 14px;
      color: var(--white);
      text-decoration: none;
      transition: background .18s, border-color .18s;
      -webkit-tap-highlight-color: transparent;
    }
    .store-btn:active { background: #1a1a1e; }
    .store-btn-text { display: flex; flex-direction: column; align-items: flex-start; }
    .store-small { font-size: 10px; color: var(--grey3); line-height: 1; margin-bottom: 2px; }
    .store-large { font-size: 16px; font-weight: 700; line-height: 1; }

    /* ── Footer ── */
    footer {
      margin-top: 40px;
      font-size: 11px;
      color: #4E5067;
      opacity: 0;
      animation: fadeUp .55s ease .72s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(0,185,145,.35); }
      70%  { box-shadow: 0 0 0 10px rgba(0,185,145,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,185,145,0); }
    }
  </style>
</head>
<body>

  <div class="page">

    <!-- Header: logo + slogan as one block -->
    <div class="header">
      <div class="logo-wrap">
        <img src="/images/logo.png" alt="TriAgain">
      </div>
      <p class="slogan">작심삼일도 괜찮아 🔥</p>
    </div>

    <!-- Hint: text centered, curved arrow below pointing at code box -->
    <div class="hint">
      <span class="hint-text">초대코드를 복사하고</span>
      <svg class="hint-arrow-svg" width="40" height="44" viewBox="0 0 40 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 6 5 C 4 18, 16 28, 20 40" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" fill="none"/>
        <path d="M 12 33 L 20 40 L 28 33" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>

    <div class="code-box" id="codeBox" onclick="copyCode()">
      <span class="code-text" id="codeText" th:text="${inviteCode}">c20jtzk</span>
      <button class="copy-btn" id="copyBtn" aria-label="복사">
        <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
        </svg>
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </button>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">앱 설치 후 입력해주세요</span>
      <div class="divider-line"></div>
    </div>

    <div class="store-wrap">
      <a class="store-btn"
         href="https://apps.apple.com/kr/app/triagain-%EC%9E%91%EC%8B%AC%EC%82%BC%EC%9D%BC%EB%8F%84-%EA%B4%9C%EC%B0%AE%EC%95%84/id6760244045"
         target="_blank" rel="noopener">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="white">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
        <div class="store-btn-text">
          <span class="store-small">다운로드</span>
          <span class="store-large">App Store</span>
        </div>
      </a>
    </div>

    <footer>© 2026 TriAgain</footer>
  </div>

  <div class="toast" id="toast">클립보드에 복사됐어요 ✓</div>

  <script>
    function copyCode() {
      const code = document.getElementById('codeText').textContent.trim();
      const box  = document.getElementById('codeBox');
      const btn  = document.getElementById('copyBtn');
      const toast = document.getElementById('toast');

      const apply = () => {
        box.classList.add('copied');
        btn.classList.add('copied');
        toast.classList.add('show');
        setTimeout(() => {
          box.classList.remove('copied');
          btn.classList.remove('copied');
          toast.classList.remove('show');
        }, 2000);
      };

      if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(apply).catch(fallback);
      } else { fallback(); }

      function fallback() {
        const el = Object.assign(document.createElement('textarea'), {
          value: code, style: 'position:fixed;opacity:0'
        });
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        apply();
      }
    }
  </script>
</body>
</html>
