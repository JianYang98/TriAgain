
spring:
  profiles:
    active: local

  jpa:
    open-in-view: false

  messages:
    basename: error-messages
    encoding: UTF-8

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    deserialization:
      fail-on-unknown-properties: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 6

  # Redis는 lock-strategy=REDIS_ASYNC에서만 사용. host/port/auth는 표준 키를 환경별로 지정한다.
  data:
    redis:
      connect-timeout: 1s
      timeout: 2s

# Boot 기본 Redis health를 끈다 — 켜 두면 DB 전략에서도 Redis 부재로 /actuator/health가 503(실측).
# REDIS_ASYNC는 CrewJoinRedisConfiguration이 같은 이름의 indicator를 직접 등록한다.
management:
  health:
    redis:
      enabled: false

jwt:
  secret: ${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci1sb2NhbC1kZXZlbG9wbWVudC1vbmx5LXRyaWFnYWlu}
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

app:
  crypto:
    # Apple refresh_token AES-256-GCM 암호화 키 (Base64 인코딩 32바이트). 운영은 ${APPLE_REFRESH_KEY} 필수.
    apple-refresh-key: ${APPLE_REFRESH_KEY:dGVzdC1rZXktMzItYnl0ZXMtZm9yLWFlcy0yNTYtISE=}

apple:
  client-id: ${APPLE_CLIENT_ID:com.triagain.triagain}
  team-id: ${APPLE_TEAM_ID:}
  key-id: ${APPLE_KEY_ID:}
  private-key: ${APPLE_PRIVATE_KEY:}

crew:
  max-duration-days: 30

triagain:
  feedback-form-url: "https://docs.google.com/forms/d/e/1FAIpQLScmW9TSnMkZhA5r9qYdeSkbRYMU863Ms02pVNhFqOIUEMMVrg/viewform"
  crew:
    lock-strategy: CONDITIONAL  # PESSIMISTIC | OPTIMISTIC | CONDITIONAL | REDIS_ASYNC (전환: --triagain.crew.lock-strategy=PESSIMISTIC)
    max-retry: 3  # 낙관적 락 version 충돌 시 재시도 횟수
  verification:
    cancel-cutoff-minutes: 5  # 마감 임박 취소 차단 구간(G2, 분)
    slot-attempt-limit: 3     # 슬롯당 최대 제출 회차(G5)
