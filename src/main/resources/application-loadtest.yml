# ⚠️ 부하테스트 전용 — 운영 사용 금지
# 사용법: --spring.profiles.active=local,loadtest (또는 dev,loadtest)
# accessToken 만료를 24시간으로 늘려 부하테스트 중 토큰 만료를 방지한다.

jwt:
  access-token-expiration: 86400000  # 24시간 (ms)

# prod 프로필이 디폴트 없이 ${APPLE_REFRESH_KEY}를 강제하므로,
# 부하테스트에서는 application.yml의 테스트용 디폴트키로 오버라이드한다.
app:
  crypto:
    apple-refresh-key: dGVzdC1rZXktMzItYnl0ZXMtZm9yLWFlcy0yNTYtISE=

internal:
  api-key: loadtest-internal-key

# FCM: firebase.enabled 미설정 → NoOpNotificationSendAdapter 자동 활성화
# (FcmAdapter는 firebase.enabled=true일 때만 로드됨)
# 실제 FCM 발송 없이 즉시 true 반환 → 비용 0, 발송 로직 검증에 집중

# ── 부하테스트 관측용 (prod 무영향, loadtest 프로파일 한정) ──

# tomcat 워커 스레드풀(tomcat_threads_*) 노출.
# MBeanRegistry가 켜져야 Micrometer가 JMX에서 스레드풀 지표를 읽는다.
server:
  tomcat:
    mbeanregistry:
      enabled: true

# HTTP 요청 지연 분포(히스토그램) 노출.
# 이게 켜져야 http_server_requests_seconds_bucket이 실리고
# Grafana에서 histogram_quantile(0.95, ...)로 p95/p99가 계산된다.
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# ── 로그 신호/잡음 (prod 무영향, loadtest 프로파일 한정) ──

# 러시 부하 시 CREW_FULL(CR002) 등 비즈니스 4xx는 "정원초과 거절"이라는
# 정상 기대 결과인데, GlobalExceptionHandler가 전부 WARN으로 찍어
# vu700 한 스윕에 CR002 WARN이 수백~1,700줄 쌓여 진짜 신호(5xx·이상)가 묻힌다.
# 핸들러를 ERROR로 올려 4xx 잡음을 죽이고, 미처리 5xx(log.error)만 남긴다.
# ⚠️ CR002 카운트·유령 409는 Prometheus(http_server_requests status=409·IOException 시리즈)로 여전히 관측 가능.
logging:
  level:
    com.triagain.common.exception.GlobalExceptionHandler: ERROR
