spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

internal:
  api-key: ${INTERNAL_API_KEY}

aws:
  s3:
    bucket: triagain-verifications
    region: ap-northeast-2

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:/opt/triagain/config/triagain-firebase-service-account.json}

logging:
  level:
    root: WARN
    com.triagain: INFO
