spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  # ALB/nginx 뒤 TLS 종료 시 X-Forwarded-Proto/Host를 신뢰해 OG 절대 URL을 https로 정확히 재구성
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}

app:
  crypto:
    apple-refresh-key: ${APPLE_REFRESH_KEY}

internal:
  api-key: ${INTERNAL_API_KEY}

aws:
  s3:
    bucket: triagain-verifications
    region: ap-northeast-2

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:/opt/triagain/config/triagain-firebase-service-account.json}

notification:
  crew-first-verification:
    enabled: ${CREW_FIRST_VERIFICATION_ENABLED:false}

logging:
  level:
    root: WARN
    com.triagain: INFO
